<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7931A"/>
      <stop offset="100%" style="stop-color:#f5af19"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Orange glow -->
  <ellipse cx="900" cy="150" rx="400" ry="300" fill="#F7931A" opacity="0.1"/>

  <!-- Purple glow -->
  <ellipse cx="200" cy="500" rx="300" ry="200" fill="#8B5CF6" opacity="0.08"/>

  <!-- Logo -->
  <circle cx="600" cy="200" r="80" fill="url(#orange)"/>
  <path d="M620 140L580 200h35l-10 45 55-60h-35l15-45z" fill="white"/>
  <circle cx="660" cy="145" r="15" fill="#8B5CF6"/>

  <!-- Title -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="white">
    Nostr Finance
  </text>

  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#F7931A" font-weight="600">
    Bitcoin Payments, Taproot Native
  </text>

  <!-- Tagline -->
  <text x="600" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="rgba(255,255,255,0.7)">
    Your Nostr Keys Are Bitcoin Keys
  </text>

  <!-- Key equation -->
  <rect x="400" y="500" width="400" height="60" rx="8" fill="rgba(247,147,26,0.15)" stroke="rgba(247,147,26,0.3)" stroke-width="2"/>
  <text x="600" y="540" text-anchor="middle" font-family="monospace" font-size="24" fill="#F7931A">
    npub... → bc1p...
  </text>
</svg>
